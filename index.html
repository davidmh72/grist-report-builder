<!DOCTYPE html>
<!--
  ============================================================
  REPORT BUILDER (report_builder.html)
  Grist Report Widget — create and edit report templates
  GitHub repo: grist-report-builder
  ============================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grist Report Builder</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; color: #333; background: #f8f9fa; }

        .builder { max-width: 800px; margin: 0 auto; }
        .builder h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #264653; }
        .builder .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }

        /* Tabs */
        .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #888; }
        .tab.active { color: #16b378; border-bottom-color: #16b378; }
        .tab:hover { color: #333; }

        /* Panels */
        .panel { display: none; }
        .panel.active { display: block; }

        /* Form elements */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group .hint { font-size: 10px; color: #aaa; margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Prompt output */
        .prompt-box { background: #1a1a2e; color: #e0e0e0; border-radius: 8px; padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
        .template-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; min-height: 200px; resize: vertical; width: 100%; }

        /* Buttons */
        .btn { padding: 10px 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn:hover { background: #f0f0f0; }
        .btn-primary { background: #16b378; color: #fff; border-color: #16b378; }
        .btn-primary:hover { background: #12956a; }
        .btn-secondary { background: #264653; color: #fff; border-color: #264653; }
        .btn-secondary:hover { background: #1a3540; }
        .btn-danger { background: #fff; color: #e53935; border-color: #e53935; }
        .btn-danger:hover { background: #fef0f0; }
        .btn-row { display: flex; gap: 8px; margin-top: 16px; }

        /* Schema display */
        .schema-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 12px; }
        .schema-table th { background: #264653; color: #fff; padding: 6px 10px; text-align: left; }
        .schema-table td { padding: 5px 10px; border-bottom: 1px solid #f0f0f0; }
        .schema-table tr:hover td { background: #f8f8f8; }

        /* Preview */
        .preview-frame { border: 1px solid #ddd; border-radius: 8px; padding: 16px; background: #fff; min-height: 200px; overflow: auto; }

        /* Status messages */
        .status { padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
        .status-success { background: #e1fede; color: #16b378; }
        .status-error { background: #fef0f0; color: #e53935; }

        /* Report list for editing */
        .report-list { list-style: none; }
        .report-list li { padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .report-list li:hover { border-color: #16b378; background: #f8fdf8; }
        .report-list .name { font-weight: 600; font-size: 13px; }
        .report-list .meta { font-size: 11px; color: #888; }
    </style>
</head>
<body>
<div class="builder">
    <h1>Report Builder</h1>
    <div class="subtitle">Create and edit report templates with AI assistance — v1.2.0</div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('create')">New Report</div>
        <div class="tab" onclick="switchTab('edit')">Edit Existing</div>
        <div class="tab" onclick="switchTab('schema')">Schema Reference</div>
        <div class="tab" onclick="switchTab('help')">Help & Features</div>
    </div>

    <div id="panel-create" class="panel active"></div>
    <div id="panel-edit" class="panel"></div>
    <div id="panel-schema" class="panel"></div>
    <div id="panel-help" class="panel"></div>
</div>

<script>
(async function() {
    "use strict";

    const REPORTS_TABLE = "SysReports";

    // ── Grist Plugin API ──────────────────────────────────────────────────
    grist.ready({ requiredAccess: "full", columns: [] });

    async function fetchTable(tableId) {
        const data = await grist.docApi.fetchTable(tableId);
        const columns = Object.keys(data);
        if (columns.length === 0) return [];
        const rowCount = data.id ? data.id.length : data[columns[0]].length;
        const rows = [];
        for (let i = 0; i < rowCount; i++) {
            const row = {};
            for (const col of columns) row[col] = data[col][i];
            rows.push(row);
        }
        return rows;
    }

    async function getSchema() {
        const tables = await fetchTable("_grist_Tables");
        const columns = await fetchTable("_grist_Tables_column");
        const schema = {};
        tables.forEach(t => {
            if (t.tableId && !t.tableId.startsWith("_grist") && !t.tableId.startsWith("GristHidden")) {
                schema[t.tableId] = { id: t.id, columns: [] };
            }
        });
        columns.forEach(c => {
            const table = tables.find(t => t.id === c.parentId);
            if (table && schema[table.tableId] && c.colId && !c.colId.startsWith("gristHelper")) {
                schema[table.tableId].columns.push({ name: c.colId, type: c.type, label: c.label || c.colId });
            }
        });
        return schema;
    }

    let schema = {};
    let reports = [];

    // ── Tab switching ────────────────────────────────────────────────────
    window.switchTab = (tab) => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        document.querySelector('.tab[onclick*="create"]').textContent = "New Report";
        document.querySelector(`.tab[onclick*="${tab}"]`).classList.add("active");
        document.getElementById(`panel-${tab}`).classList.add("active");
        if (tab === "create") renderCreatePanel();
        if (tab === "edit") renderEditPanel();
        if (tab === "schema") renderSchemaPanel();
        if (tab === "help") renderHelpPanel();
    };

    // ── Create Panel ──────────────────────────────────────────────────────
    function renderCreatePanel(existingReport) {
        const tableOptions = Object.keys(schema).map(t => `<option value="${t}">${t}</option>`).join("");
        const isEdit = !!existingReport;
        const r = existingReport || {};

        document.getElementById("panel-create").innerHTML = `
            <div id="status-area"></div>

            ${!isEdit ? `<div style="background:#f0faf6; border:1px solid #d0ebe0; border-radius:8px; padding:14px 16px; margin-bottom:20px;">
                <div style="font-size:12px; font-weight:600; color:#16b378; margin-bottom:8px;">⚡ Quick Start (AI-assisted)</div>
                <div class="btn-row" style="margin-bottom:10px;">
                    <button class="btn btn-secondary" onclick="copySpecStructure()">📋 Copy Schema Prompt for AI</button>
                </div>
                <div class="form-group" style="margin-bottom:8px;">
                    <label style="margin-bottom:4px;">Paste AI-generated spec here</label>
                    <textarea id="import-spec" style="min-height:80px; font-family: 'SF Mono', 'Fira Code', monospace; font-size:11px;" placeholder="| Field | Value |&#10;|-------|-------|&#10;| Report_Name | My Report |&#10;| Data_Tables | Contacts,Deals |&#10;| Filter_Mode | all |&#10;| Report_Requirements | ... |"></textarea>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="importSpecToForm()">📥 Import Spec to Form</button>
                    <button class="btn" onclick="previewImport()">👁 Preview Parse</button>
                </div>
                <div id="import-preview" style="margin-top:10px; display:none;">
                    <div id="import-preview-content" style="background:#fff; border:1px solid #eee; border-radius:6px; padding:10px; font-size:11px;"></div>
                </div>
            </div>
            <div style="text-align:center; color:#bbb; font-size:11px; margin-bottom:16px;">── or fill in manually ──</div>` : ""}

            <div class="form-row">
                <div class="form-group">
                    <label>Report Name</label>
                    <input type="text" id="rpt-name" value="${r.Report_Name || ""}" placeholder="e.g. Contact Activity Dashboard">
                </div>
                <div class="form-group">
                    <label>Filter Mode</label>
                    <select id="rpt-mode">
                        <option value="all" ${r.Filter_Mode === "all" ? "selected" : ""}>All (no filter)</option>
                        <option value="record" ${r.Filter_Mode === "record" ? "selected" : ""}>Record (selected record)</option>
                        <option value="filtered" ${r.Filter_Mode === "filtered" ? "selected" : ""}>Filtered (popup)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Output</label>
                    <select id="rpt-output">
                        <option value="screen" ${r.Output === "screen" ? "selected" : ""}>Screen</option>
                        <option value="print" ${r.Output === "print" ? "selected" : ""}>Print</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Link Table (which page it appears on)</label>
                    <select id="rpt-link"><option value="">-- Select --</option>${tableOptions}</select>
                </div>
                <div class="form-group">
                    <label>Data Tables (comma-separated)</label>
                    <input type="text" id="rpt-data" value="${r.Data_Tables || ""}" placeholder="e.g. Contacts,OrganisationContacts">
                    <div class="hint">All tables the report needs data from</div>
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="rpt-desc" value="${r.Description || ""}" placeholder="Brief description of what this report shows">
            </div>
            <div class="form-group">
                <label>Report Requirements (saved for future editing)</label>
                <textarea id="rpt-request" placeholder="e.g. A dashboard with KPI cards showing total contacts, active vs inactive. Bar chart of contacts by country. Table listing all contacts with name, email, status, and last updated date. Use a dark header theme.">${r.Report_Requirements || ""}</textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-secondary" onclick="generatePrompt()">📋 Generate AI Prompt</button>
                ${isEdit ? `<button class="btn btn-danger" onclick="switchTab('edit')">Cancel</button>` : ""}
            </div>

            <div id="prompt-output" style="margin-top: 20px; display: none;">
                <div class="form-group">
                    <label>AI Prompt (copy this to ChatGPT/Claude)</label>
                    <div class="prompt-box" id="prompt-text"></div>
                    <div class="btn-row">
                        <button class="btn" onclick="copyPrompt()">📋 Copy to Clipboard</button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <div class="form-group">
                    <label>Template HTML (paste AI output here)</label>
                    <textarea class="template-box" id="rpt-template" placeholder="Paste the HTML template from the AI here...">${r.Template_HTML || ""}</textarea>
                </div>
                <div class="form-group">
                    <label>Filters JSON (optional, for filtered mode)</label>
                    <textarea id="rpt-filters" style="min-height: 60px; font-family: monospace; font-size: 11px;" placeholder='[{"field":"Status","label":"Status","type":"choice","table":"Contacts"}]'>${r.Filters || ""}</textarea>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="previewReport()">👁 Preview</button>
                    <button class="btn btn-primary" onclick="saveReport(${isEdit ? r.id : "null"}, false)">💾 Save${isEdit ? "" : " Report"}</button>
                    ${isEdit ? `<button class="btn" onclick="saveReport(${r.id}, true)">💾 Save as New Version</button>` : ""}
                </div>
            </div>

            <div id="preview-area" style="margin-top: 20px; display: none;">
                <label style="font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; margin-bottom: 8px; display: block;">Preview</label>
                <div class="preview-frame" id="preview-frame"></div>
            </div>
        `;

        if (r.Link_Table) document.getElementById("rpt-link").value = r.Link_Table;
    }

    // ── Prompt Generator ────────────────────────────────────────────────────
    window.generatePrompt = () => {
        const linkTable = document.getElementById("rpt-link").value;
        const dataTables = document.getElementById("rpt-data").value || linkTable;
        const request = document.getElementById("rpt-request").value;
        const mode = document.getElementById("rpt-mode").value;
        const output = document.getElementById("rpt-output").value;

        const tables = dataTables.split(",").map(t => t.trim()).filter(Boolean);
        let schemaText = "";
        tables.forEach(t => {
            if (schema[t]) {
                schemaText += `\nTable: ${t}\nColumns:\n`;
                schema[t].columns.forEach(c => {
                    schemaText += `  - ${c.name} (${c.type})${c.label !== c.name ? ` [label: "${c.label}"]` : ""}\n`;
                });
            }
        });

        const prompt = `You are a report template designer for a Grist spreadsheet reporting system.

Generate a complete HTML template (HTML + inline CSS + Handlebars placeholders) for the following report.

OUTPUT RULES:
- Output the HTML inside a single code block (triple backticks with \`\`\`html language tag).
- The code must be properly indented (2-space indentation) for readability.
- Start the code with <style> and end with the final </div>.
- Do NOT output any text, explanation, or commentary outside the code block.
- Use a <style> block for all CSS. Use CSS Grid for dashboard layouts.
- Include @media print { } rules for clean PDF output (hide non-essential elements, avoid page-break inside cards).
- ABSOLUTELY NO <script> TAGS OR JAVASCRIPT. The template is injected via innerHTML which does not execute scripts. All interactivity is handled by declarative data attributes (see VISUAL ELEMENTS below).
- Do NOT use DOMContentLoaded, window.onload, setTimeout, or any JS initialisation code.

DATA STRUCTURE:
- Data is an object where each table name is a key containing an array of row objects.
- Access: {{#each ${tables[0]}}}{{field_name}}{{/${tables[0]}}}
- The first table in the list is the primary table.
- data-chart-group auto-counts occurrences — no need to pre-aggregate data.
- Every row has an "id" field (numeric record ID) accessible as {{id}}.
- Reference columns (Ref fields) store the numeric ID of the referenced record, NOT the display name.
- Always handle empty tables gracefully: use {{#each Table}}...{{else}}<p>No records found</p>{{/each}} for linked/secondary tables to avoid rendering empty headers or broken layouts.
- Always wrap Date-type columns in {{formatDate field}} or {{formatDateTime field}}, and monetary Numeric fields in {{currency field "GBP"}} or {{formatNumber field}}.

CRITICAL — HOW RECORD MODE WORKS:
- In "record" mode, the widget has ALREADY filtered all data for you:
  - The primary table contains ONLY the selected record (1 row)
  - All other tables listed in Data_Tables are ALREADY filtered to only rows related to that record
- You do NOT need to manually filter linked tables in the template
- Simply loop over each table directly: {{#each TableName}}...{{/each}} — the data is already correct
- Do NOT use {{#if (eq SomeRef ../id)}} or any manual filtering logic — the widget handles this automatically
- Do NOT try to match records by name, email, ID, or any field — all filtering is pre-done

CRITICAL — HOW ALL/FILTERED MODE WORKS:
- All tables contain their full (or user-filtered) dataset
- Loop over them directly: {{#each Contacts}}...{{/each}}
- For linked table data within a loop, you CANNOT access other tables from inside {{#each}}
- Use {{#groupBy}} or {{#filterBy}} on the same table, not cross-table lookups
- Charts handle cross-table automatically via data-chart-table attribute

SCOPE RULES:
- Inside {{#each Contacts}}, access fields directly: {{First_Name}}, {{Email}}
- To access the root data from inside a loop, use @root: {{@root.Deals}}, {{count @root.Tasks}}
- To access parent context, use ../: {{../someValue}}
- {{@index}} gives the current loop index (0-based)

HANDLEBARS HELPERS:
  BLOCK helpers (use {{#helper}}...{{/helper}}, render inner content):
    {{#each arr}}...{{/each}} — loop over array
    {{#if condition}}...{{/if}} — conditional block
    {{#groupBy arr "field"}}...{{/groupBy}} — groups rows, provides {{key}}, {{items}}, {{count}}
    {{#filterBy arr "field" "value"}}...{{/filterBy}} — filters rows, provides {{items}}, {{count}}
    {{#columns N}}...{{/columns}} — multi-column CSS layout
    {{#monthGrid year month}}{{#each days}}...{{/each}}{{/monthGrid}} — calendar grid

  INLINE helpers (use {{helper args}}, return a value directly):
    {{count arr}} — array length (number)
    {{sum arr "field"}} — sum of numeric field
    {{avg arr "field"}} — average
    {{max arr "field"}} — maximum
    {{min arr "field"}} — minimum
    {{percent a b}} — percentage string "45.2%"
    {{round n 2}} — round to N decimals
    {{add a b}}, {{subtract a b}}, {{multiply a b}}, {{divide a b}} — arithmetic
    {{formatDate field}} — format epoch seconds to "25 May 2025"
    {{formatDateTime field}} — "25 May 2025 14:30"
    {{now}} — current date as formatted string (NOT a timestamp — do not pass to formatDate)
    {{year field}}, {{month field}}, {{dayOfWeek field}} — extract date parts
    {{monthName 5}} — "June"
    {{uppercase str}}, {{lowercase str}}, {{truncate str 20}}, {{replace str "old" "new"}}
    {{eq a b}}, {{neq a b}}, {{gt a b}}, {{lt a b}}, {{gte a b}}, {{lte a b}} — return true/false
    {{and a b}}, {{or a b}}, {{not a}} — logic
    {{pageBreak}} — insert print page break
    {{unique arr "field"}} — returns array of unique values

  SUB-EXPRESSION helpers (can be used inside parentheses):
    {{#each (sortBy arr "field" "asc")}} ✓ — sortBy returns an array
    {{#if (eq Status "Active")}} ✓ — eq returns true/false
    {{#if (gt (count arr) 10)}} ✓ — count returns a number
    {{#each (unique arr "field")}} ✓ — unique returns an array

  CANNOT be used as sub-expressions (they are block helpers):
    {{count (filterBy ...)}} ✗ — filterBy is a BLOCK helper
    {{count (groupBy ...)}} ✗ — groupBy is a BLOCK helper
    {{formatDateTime (now)}} ✗ — now returns a string, not a timestamp

  CORRECT PATTERNS for filtered counts:
    {{#filterBy Contacts "Status" "Active"}}{{count items}}{{/filterBy}}
    {{#filterBy Contacts "Status" "Active"}}{{percent count (count ../Contacts)}}{{/filterBy}}

VISUAL ELEMENTS:
  Charts: <canvas data-chart-type="TYPE" data-chart-table="Table" data-chart-group="Field" data-chart-title="Title">
    Types: bar, line, pie, doughnut, radar, polarArea, scatter, bubble
    Advanced (full Chart.js config): <canvas data-chart='{"type":"radar","data":{"labels":[...],"datasets":[...]},"options":{}}'>
  Maps: <div data-map data-map-table="Table" data-map-lat="Latitude" data-map-lng="Longitude" data-map-label="Name" data-map-colour="Status" style="height:400px"></div>
    Add data-map-cluster="true" for marker clustering (groups nearby pins)
    Add data-map-heat="true" for heatmap mode (density visualisation)
  QR codes: <div data-qr="{{field}}" data-qr-size="128"></div>
  Barcodes: <div data-barcode="{{field}}" data-barcode-format="CODE128"></div>
  Images: <img data-asset="filename.png">

VISUAL HELPERS (inline, return rendered HTML):
  {{progressBar value max}} — inline green progress bar
  {{stars 3 5}} — ★★★☆☆ star rating
  {{colourScale value min max}} — coloured dot (green-to-red scale)
  {{initials "John Smith"}} — coloured circle avatar with "JS"
  {{watermark "DRAFT"}} — faint diagonal background text
  {{signatureLine "Approved by"}} — signature line for printed forms
  {{#labels 3}}...{{/labels}} — grid layout for mailing labels (N columns)

FORMATTING HELPERS (inline, return text):
  {{formatNumber 1234567}} — "1,234,567"
  {{currency value "GBP"}} — £1,234.56 (supports any ISO currency code)
  {{timeAgo timestamp}} — "3 days ago", "2 months ago"

${output === "screen" ? `STYLE GUIDE:
- Professional, clean, modern. Think Power BI / executive dashboard.
- Use KPI cards (big number + label) for summary metrics.
- Use colour-coded badges/pills for status fields.
- Use subtle borders, rounded corners, consistent spacing.
- Dark headers with white text for section titles.
- Tables: alternating row colours, hover highlight, compact font size.` : `STYLE GUIDE:
- Professional, clean, minimal. Optimised for paper/PDF output.
- Use compact font sizes (10-11px body, 8-9px table cells).
- Use thin borders and lines to separate sections — avoid heavy background colours.
- Tables: full-width, alternating light row shading, compact padding.
- Use bold text and underlines for emphasis instead of colour blocks.`}
${mode === "record" ? `\nMODE: SINGLE RECORD — The primary table will contain exactly one row, but it is still passed as an ARRAY. You MUST wrap all primary table field access inside {{#each PrimaryTableName}}...{{/each}}. Example:
  {{#each Contacts}}
    <h1>{{First_Name}} {{Last_Name}}</h1>
    <p>{{Email}}</p>
  {{/each}}
Do NOT access fields like {{First_Name}} at the top level — that will not work. Always use {{#each TableName}} even for a single record.
Linked tables (Deals, Tasks, etc.) are also arrays filtered to this record. Loop them with {{#each Deals}}...{{/each}}.` : ""}${mode === "filtered" ? "\nMODE: FILTERED — Data is pre-filtered by the user. Design a summary dashboard with KPI cards, charts, and a detail table." : ""}${mode === "all" ? "\nMODE: ALL DATA — Full dataset. Design a comprehensive overview with charts and grouped tables." : ""}
${output === "print" ? `\nOUTPUT: PRINT (PAPER)
- Design for A4/Letter paper, not screen.
- Use a single-column or simple two-column layout. NO CSS Grid dashboards.
- Use compact font sizes (10-11px body, 8-9px table cells).
- Minimise whitespace — tight padding and margins.
- Use light colours only — avoid dark backgrounds (they waste ink).
- Use borders and lines to separate sections instead of background colours.
- Add page-break-before on major sections if the report is long.
- Tables should be full-width with thin borders.
- Charts should be small (max 300px height) and positioned inline.
- Do NOT use box-shadow, border-radius, or gradients.
- Include a header with report title and date, and a footer with page context.` : `\nOUTPUT: SCREEN
- Design for screen display inside a Grist widget.
- Use CSS Grid for dashboard layouts with cards.
- Use generous padding, rounded corners, subtle shadows.
- Dark headers, colour-coded badges, modern styling.
- Charts can be any size. Maps are interactive.
- Optimise for visual impact and readability on screen.`}

DATABASE SCHEMA:
${schemaText}

REPORT REQUEST:
${request}

IMPORTANT: Do NOT generate the template yet. First, ask 3-5 clarifying questions to ensure you understand exactly what is needed (e.g. "Should the table show all fields or just key ones?", "Do you want a dark or light theme?", "Should records be grouped by any field?", "Portrait or landscape for print?"). After I answer, then generate the final template.

WHEN GENERATING:
- Output valid, well-formed HTML only. Ensure all tags are properly closed.
- Use the REAL column names from the DATABASE SCHEMA above — not placeholder or demo names.
- Reference tables exactly as listed in the schema (case-sensitive).
- Do not invent fields that don't exist in the schema. Only use columns listed above.
- Do not include sample/hardcoded data. All values must come from Handlebars placeholders referencing real fields.`;

        document.getElementById("prompt-text").textContent = prompt;
        document.getElementById("prompt-output").style.display = "block";
    };

    window.copyPrompt = () => {
        const text = document.getElementById("prompt-text").textContent;
        navigator.clipboard.writeText(text).then(() => {
            showStatus("Prompt copied to clipboard!", "success");
        });
    };    // ── Preview ────────────────────────────────────────────────────────────
    window.previewReport = async () => {
        const templateHTML = document.getElementById("rpt-template").value;
        const dataTables = (document.getElementById("rpt-data").value || document.getElementById("rpt-link").value).split(",").map(t => t.trim()).filter(Boolean);

        if (!templateHTML) { showStatus("Paste a template first", "error"); return; }

        try {
            const data = {};
            await Promise.all(dataTables.map(async (table) => { data[table] = await fetchTable(table); }));
            data._meta = { reportName: "Preview", generatedAt: new Date().toLocaleString("en-GB"), recordCounts: {} };
            for (const [t, rows] of Object.entries(data)) { if (t !== "_meta") data._meta.recordCounts[t] = rows.length; }

            // Register helpers (same as report widget)
            registerHelpers();

            const template = Handlebars.compile(templateHTML);
            const html = template(data);

            const frame = document.getElementById("preview-frame");
            frame.innerHTML = html;
            document.getElementById("preview-area").style.display = "block";

            // Render charts in preview
            frame.querySelectorAll("canvas[data-chart-type]").forEach(canvas => {
                try {
                    const type = canvas.dataset.chartType;
                    const tableData = data[canvas.dataset.chartTable];
                    const groupField = canvas.dataset.chartGroup;
                    const title = canvas.dataset.chartTitle || "";
                    if (!Array.isArray(tableData)) return;
                    const groups = {};
                    tableData.forEach(row => { const k = row[groupField] || "(blank)"; groups[k] = (groups[k] || 0) + 1; });
                    const colours = ["#16b378","#e63946","#457b9d","#f4a261","#6a4c93","#2a9d8f","#e76f51","#264653"];
                    new Chart(canvas, { type, data: { labels: Object.keys(groups), datasets: [{ data: Object.values(groups), backgroundColor: Object.keys(groups).map((_, i) => colours[i % colours.length]) }] }, options: { responsive: true, plugins: { title: { display: !!title, text: title }, legend: { display: type === "pie" || type === "doughnut" } } } });
                } catch(e) { console.error("Preview chart error:", e); }
            });

            showStatus("Preview rendered successfully", "success");
        } catch(e) {
            showStatus("Preview error: " + e.message, "error");
        }
    };

    function registerHelpers() {
        const h = Handlebars;
        if (h._buildersRegistered) return;
        h._buildersRegistered = true;
        h.registerHelper("eq", (a, b) => a === b);
        h.registerHelper("neq", (a, b) => a !== b);
        h.registerHelper("gt", (a, b) => a > b);
        h.registerHelper("lt", (a, b) => a < b);
        h.registerHelper("gte", (a, b) => a >= b);
        h.registerHelper("lte", (a, b) => a <= b);
        h.registerHelper("and", (a, b) => a && b);
        h.registerHelper("or", (a, b) => a || b);
        h.registerHelper("not", (a) => !a);
        h.registerHelper("add", (a, b) => Number(a) + Number(b));
        h.registerHelper("subtract", (a, b) => Number(a) - Number(b));
        h.registerHelper("multiply", (a, b) => Number(a) * Number(b));
        h.registerHelper("divide", (a, b) => b !== 0 ? Number(a) / Number(b) : 0);
        h.registerHelper("percent", (a, b) => b !== 0 ? ((a / b) * 100).toFixed(1) + "%" : "0%");
        h.registerHelper("round", (n, d) => Number(n).toFixed(typeof d === "number" ? d : 0));
        h.registerHelper("count", (arr) => Array.isArray(arr) ? arr.length : 0);
        h.registerHelper("sum", function(arr, key) { if (!Array.isArray(arr)) return 0; return arr.reduce((s, i) => s + (Number(i[key]) || 0), 0); });
        h.registerHelper("avg", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return (arr.reduce((s, i) => s + (Number(i[key]) || 0), 0) / arr.length).toFixed(1); });
        h.registerHelper("max", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return Math.max(...arr.map(i => Number(i[key]) || 0)); });
        h.registerHelper("min", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return Math.min(...arr.map(i => Number(i[key]) || 0)); });
        h.registerHelper("unique", function(arr, key) { if (!Array.isArray(arr)) return []; return [...new Set(arr.map(i => i[key]).filter(Boolean))]; });
        h.registerHelper("groupBy", function(arr, key, options) { if (!Array.isArray(arr)) return ""; const g = {}; arr.forEach(i => { const k = i[key] || "(blank)"; if (!g[k]) g[k] = []; g[k].push(i); }); let o = ""; for (const [k, items] of Object.entries(g)) o += options.fn({ key: k, items, count: items.length }); return o; });
        h.registerHelper("filterBy", function(arr, key, value, options) { if (!Array.isArray(arr)) return ""; const f = arr.filter(i => i[key] === value); return options.fn({ items: f, count: f.length }); });
        h.registerHelper("sortBy", function(arr, key, dir) { if (!Array.isArray(arr)) return []; const s = [...arr].sort((a, b) => a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0); return dir === "desc" ? s.reverse() : s; });
        h.registerHelper("formatDate", (val) => { if (!val) return ""; return new Date(val * 1000).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); });
        h.registerHelper("now", () => new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }));
        h.registerHelper("uppercase", (s) => String(s || "").toUpperCase());
        h.registerHelper("lowercase", (s) => String(s || "").toLowerCase());
        h.registerHelper("truncate", (s, len) => { const str = String(s || ""); return str.length > len ? str.slice(0, len) + "..." : str; });
    }

    // ── Save Report ────────────────────────────────────────────────────────
    window.saveReport = async (existingId, asNewVersion) => {
        const name = document.getElementById("rpt-name").value.trim();
        const desc = document.getElementById("rpt-desc").value.trim();
        const linkTable = document.getElementById("rpt-link").value;
        const dataTables = document.getElementById("rpt-data").value.trim();
        const mode = document.getElementById("rpt-mode").value;
        const output = document.getElementById("rpt-output").value;
        const templateHTML = document.getElementById("rpt-template").value;
        const filters = document.getElementById("rpt-filters").value.trim();
        const requirements = document.getElementById("rpt-request").value.trim();

        if (!name) { showStatus("Report name is required", "error"); return; }
        if (!templateHTML) { showStatus("Template HTML is required", "error"); return; }

        try {
            const fields = {
                Report_Name: name,
                Description: desc,
                Link_Table: linkTable,
                Data_Tables: dataTables,
                Filter_Mode: mode,
                Output: output,
                Template_HTML: templateHTML,
                Filters: filters,
                Report_Requirements: requirements,
                Active: true
            };

            if (existingId && !asNewVersion) {
                // Update in place
                await grist.docApi.applyUserActions([["UpdateRecord", REPORTS_TABLE, existingId, fields]]);
            } else if (existingId && asNewVersion) {
                // Deactivate old, create new version
                await grist.docApi.applyUserActions([["UpdateRecord", REPORTS_TABLE, existingId, { Active: false }]]);
                // Increment version in name
                let versionName = name;
                const versionMatch = name.match(/- Version (\d+)$/);
                if (versionMatch) {
                    versionName = name.replace(/- Version \d+$/, "- Version " + (parseInt(versionMatch[1]) + 1));
                } else {
                    versionName = name + " - Version 2";
                }
                fields.Report_Name = versionName;
                await grist.docApi.applyUserActions([["AddRecord", REPORTS_TABLE, null, fields]]);
            } else {
                // Brand new report
                await grist.docApi.applyUserActions([["AddRecord", REPORTS_TABLE, null, fields]]);
            }

            // Refresh reports list
            reports = await fetchTable(REPORTS_TABLE);
            reports = reports.filter(r => r.Active === true);

            showStatus('"' + (fields.Report_Name || name) + '" saved successfully.', "success");
        } catch(e) {
            showStatus("Save failed: " + e.message, "error");
        }
    };

    // ── Import Spec Utilities ──────────────────────────────────────────────
    function parseSpecTable(text) {
        // Try pipe-delimited markdown table first
        const lines = text.trim().split("\n").filter(l => l.trim().startsWith("|"));
        if (lines.length >= 2) {
            const result = {};
            const dataLines = lines.filter(l => !l.match(/^\|\s*[-:]+/));
            const rows = dataLines.slice(1);
            rows.forEach(line => {
                const cells = line.split("|").map(c => c.trim()).filter(Boolean);
                if (cells.length >= 2) {
                    let field = cells[0].trim();
                    let value = cells.slice(1).join("|").trim();
                    value = value.replace(/^`+/, "").replace(/`+$/, "").trim();
                    result[field] = value;
                }
            });
            if (Object.keys(result).length > 0) return result;
        }

        // Fallback: parse "FieldValue" pairs (copied from rendered table without pipes)
        const KNOWN_FIELDS = ["Report_Name","Description","Link_Table","Data_Tables","Filter_Mode","Output","Filters","Report_Requirements"];
        const raw = text.trim();
        // Try to split on known field names
        const result = {};
        for (let i = 0; i < KNOWN_FIELDS.length; i++) {
            const field = KNOWN_FIELDS[i];
            const idx = raw.indexOf(field);
            if (idx === -1) continue;
            const valueStart = idx + field.length;
            // Find where the next field starts
            let valueEnd = raw.length;
            for (let j = 0; j < KNOWN_FIELDS.length; j++) {
                if (j === i) continue;
                const nextIdx = raw.indexOf(KNOWN_FIELDS[j], valueStart);
                if (nextIdx > valueStart && nextIdx < valueEnd) valueEnd = nextIdx;
            }
            let value = raw.slice(valueStart, valueEnd).trim();
            value = value.replace(/^`+/, "").replace(/`+$/, "").trim();
            if (value) result[field] = value;
        }
        return Object.keys(result).length > 0 ? result : null;
    }

    const FIELD_MAP = {
        "Report_Name": "Report_Name", "Report Name": "Report_Name", "Name": "Report_Name",
        "Description": "Description",
        "Link_Table": "Link_Table", "Link Table": "Link_Table",
        "Data_Tables": "Data_Tables", "Data Tables": "Data_Tables",
        "Filter_Mode": "Filter_Mode", "Filter Mode": "Filter_Mode", "Mode": "Filter_Mode",
        "Output": "Output",
        "Template_HTML": "Template_HTML", "Template HTML": "Template_HTML", "Template": "Template_HTML",
        "Filters": "Filters",
        "Report_Requirements": "Report_Requirements", "Report Requirements": "Report_Requirements", "Requirements": "Report_Requirements"
    };

    function normalizeSpec(parsed) {
        const record = {};
        for (const [key, value] of Object.entries(parsed)) {
            const mapped = FIELD_MAP[key];
            if (mapped) record[mapped] = value;
        }
        return record;
    }

            <table class="schema-table">
                <tr><th>Helper</th><th>Output</th></tr>
                <tr><td><code>{{formatDate field}}</code></td><td>25 May 2025</td></tr>
                <tr><td><code>{{formatDateTime field}}</code></td><td>25 May 2025 14:30</td></tr>
                <tr><td><code>{{now}}</code></td><td>Current date</td></tr>
                <tr><td><code>{{year field}}</code></td><td>2025</td></tr>
                <tr><td><code>{{monthName 5}}</code></td><td>June</td></tr>
                <tr><td><code>{{dayOfWeek field}}</code></td><td>Mon, Tue, etc.</td></tr>
            </table>

            <h4 style="margin:16px 0 8px; color:#16b378;">🔤 String & Logic Helpers</h4>
            <table class="schema-table">
                <tr><th>Helper</th><th>Output</th></tr>
                <tr><td><code>{{uppercase str}}</code></td><td>UPPERCASE</td></tr>
                <tr><td><code>{{lowercase str}}</code></td><td>lowercase</td></tr>
                <tr><td><code>{{truncate str 20}}</code></td><td>First 20 chars...</td></tr>
                <tr><td><code>{{replace str "old" "new"}}</code></td><td>String replacement</td></tr>
                <tr><td><code>{{#if (eq Status "Active")}}...{{/if}}</code></td><td>Conditional</td></tr>
                <tr><td><code>{{#if (gt count 10)}}...{{/if}}</code></td><td>Numeric comparison</td></tr>
            </table>

            <h4 style="margin:16px 0 8px; color:#16b378;">🏷️ Report Modes (Filter_Mode)</h4>
            <table class="schema-table">
                <tr><th>Mode</th><th>Behaviour</th></tr>
                <tr><td><code>record</code></td><td>Uses the selected record from the linked widget. Linked tables auto-filtered.</td></tr>
                <tr><td><code>all</code></td><td>Fetches all data, renders immediately. No filter popup.</td></tr>
                <tr><td><code>filtered</code></td><td>Shows filter popup before rendering. Define filters in the Filters JSON column.</td></tr>
            </table>

            <h4 style="margin:16px 0 8px; color:#16b378;">🔍 Filter Types (Filters JSON)</h4>
            <table class="schema-table">
                <tr><th>Type</th><th>UI</th><th>Example</th></tr>
                <tr><td><code>choice</code></td><td>Multi-select checkboxes</td><td><code>{"field":"Status","label":"Status","type":"choice","table":"Contacts"}</code></td></tr>
                <tr><td><code>date-range</code></td><td>From/To date pickers</td><td><code>{"field":"Last_Updated","label":"Updated","type":"date-range","table":"Contacts"}</code></td></tr>
                <tr><td><code>number-range</code></td><td>Min/Max inputs</td><td><code>{"field":"Score","label":"Score","type":"number-range","table":"Contacts"}</code></td></tr>
                <tr><td><code>text</code></td><td>Free text search</td><td><code>{"field":"Last_Name","label":"Name","type":"text","table":"Contacts"}</code></td></tr>
                <tr><td><code>boolean</code></td><td>Checkbox</td><td><code>{"field":"Active","label":"Active only","type":"boolean","table":"Contacts"}</code></td></tr>
            </table>

            <h4 style="margin:16px 0 8px; color:#16b378;">📋 SysReports Table Columns</h4>
            <table class="schema-table">
                <tr><th>Column</th><th>Type</th><th>Purpose</th></tr>
                <tr><td>Report_Name</td><td>Text</td><td>Display name</td></tr>
                <tr><td>Description</td><td>Text</td><td>Shown in picker</td></tr>
                <tr><td>Link_Table</td><td>Text</td><td>Which page this report appears on</td></tr>
                <tr><td>Data_Tables</td><td>Text</td><td>Comma-separated tables to fetch</td></tr>
                <tr><td>Filter_Mode</td><td>Choice</td><td>record / all / filtered</td></tr>
                <tr><td>Template_HTML</td><td>Text</td><td>The Handlebars HTML template</td></tr>
                <tr><td>Filters</td><td>Text</td><td>JSON array of filter definitions</td></tr>
                <tr><td>Assets</td><td>Attachments</td><td>Logos, images (reference via data-asset)</td></tr>
            </table>
        </div>
        `;
    }

    const WIDGET_NAME = "Report Builder";
    const WIDGET_VERSION = "1.0.1";

    // ── Initialise ──────────────────────────────────────────────────────────
    console.log(`📋 ${WIDGET_NAME} v${WIDGET_VERSION} loading...`);
    setTimeout(async () => {
        try {
            console.log(`📋 ${WIDGET_NAME}: Fetching schema...`);
            schema = await getSchema();
            console.log(`📋 ${WIDGET_NAME}: Schema loaded (${Object.keys(schema).length} tables)`);
            console.log(`📋 ${WIDGET_NAME}: Fetching ${REPORTS_TABLE}...`);
            reports = await fetchTable(REPORTS_TABLE);
            reports = reports.filter(r => r.Active === true);
            console.log(`📋 ${WIDGET_NAME}: ${reports.length} active reports loaded`);
            renderCreatePanel();
        } catch(e) {
            console.error(`📋 ${WIDGET_NAME}: Init failed:`, e);
            document.getElementById("panel-create").innerHTML = `<div class="status status-error">Error: ${e.message}<br><small>${WIDGET_NAME} v${WIDGET_VERSION}</small></div>`;
        }
    }, 500);

})();
</script>
</body>
</html>
